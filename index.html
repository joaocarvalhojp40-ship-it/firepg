<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>FirePG | Bots Profissionais</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="firepg.png">

<style>
/* ===== VARIÁVEIS ===== */
:root{
  --red:#ff2a2a;
  --orange:#ff7a18;
  --glass:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.15);
  --gray:#9a9a9a;
  --green:#2ecc71;
  --error:#e74c3c;
}

*{box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{margin:0;background:#050505;color:#fff;padding-bottom:50px}
.hidden{display:none!important}
.fade-in{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@keyframes fire{from{text-shadow:0 0 10px rgba(255,90,40,.4)}to{text-shadow:0 0 22px rgba(255,120,60,.8)}}

/* ===== NAV ===== */
nav{
  display:flex;justify-content:center;gap:20px;
  padding:20px;background:rgba(0,0,0,.8);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)
}
nav button{background:transparent;border:none;color:var(--gray)}
nav button.active{color:#fff;border-bottom:2px solid var(--orange)}

/* ===== LOGO ===== */
.logo{
  font-size:3.3rem;font-weight:900;text-align:center;
  background:linear-gradient(90deg,var(--red),var(--orange));
  -webkit-background-clip:text;color:transparent;
  animation:fire 2.5s infinite alternate;margin-top:30px
}
.subtitle{text-align:center;color:var(--gray);margin-bottom:40px}

/* ===== CONTAINERS ===== */
.glass{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
  max-width:1000px;
  margin:25px auto;
}

/* ===== INPUTS ===== */
input,select{
  width:100%;padding:14px;margin-top:12px;
  border-radius:12px;border:1px solid var(--border);
  background:#0e0e0e;color:#fff
}
button{
  margin-top:16px;
  background:linear-gradient(90deg,var(--red),var(--orange));
  border:none;padding:14px 22px;
  border-radius:14px;color:#fff;font-weight:700;cursor:pointer
}
button.danger{background:var(--error)}
button.success{background:var(--green)}

/* ===== PERFIL ===== */
.profile-header{display:flex;gap:20px;align-items:center}
.avatar{width:80px;height:80px;border-radius:50%;border:2px solid var(--orange)}

/* ===== LISTA USERS ===== */
.user-list-item{
  display:flex;justify-content:space-between;
  background:#000;padding:10px;
  border-radius:8px;margin-bottom:6px
}

/* ===== LOCK ===== */
#lock{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  display:flex;align-items:center;justify-content:center;z-index:999
}
.lock-box{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:22px;
  padding:35px;text-align:center;max-width:400px
}
</style>
</head>

<body>

<!-- LOCK -->
<div id="lock">
  <div class="lock-box">
    <h2>Acesso Restrito</h2>
    <p>É obrigatório entrar com Discord para usar a FirePG.</p>
    <button onclick="login()">Entrar com Discord</button>
  </div>
</div>

<nav id="navbar" class="hidden">
  <button onclick="mudarAba('inicio')" id="btn-inicio" class="active">Início</button>
  <button onclick="mudarAba('loja')" id="btn-loja">Loja</button>
  <button onclick="mudarAba('painel')" id="btn-painel">Painel</button>
</nav>

<div class="logo">FirePG</div>
<p class="subtitle">Bots profissionais para Discord</p>

<section id="aba-inicio" class="fade-in">

<div class="glass">
  <div class="profile-header">
    <img id="avatar" class="avatar">
    <div>
      <h2 id="user-name">Carregando...</h2>
      <p>ID: <span id="user-id">...</span></p>
      <p>IP: <b id="user-ip">...</b></p>
      <p style="font-size:.8rem;color:var(--green)">Status: Seguro ✅</p>
    </div>
  </div>
  <button class="danger" onclick="logout()">Sair</button>
</div>

<div class="glass">
  <h2>Solicitar Bot</h2>
  <input id="descricao" placeholder="Descrição detalhada do bot">
  <input id="linguagem" placeholder="Linguagem (JS, Java, Python)">
  <select id="estilo">
    <option value="">Selecione o estilo</option>
    <option>Moderação</option>
    <option>Economia</option>
    <option>Utilidade</option>
    <option>Comunidade</option>
  </select>
  <input id="promo-code" placeholder="Código promocional (opcional)">
  <button onclick="enviarPedido()">Enviar Solicitação</button>
</div>

</section>

<section id="aba-painel" class="hidden fade-in">
<div class="glass">
  <h2>Usuários Registrados</h2>
  <div id="users-list">Carregando...</div>
</div>
</section>

<script>
/* ================= CONFIGURAÇÕES (MANTIDAS) ================= */
const CONFIG = {
  DISCORD_CLIENT_ID: "1461307002570412084",
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1461334091159834698/cw_4iza4UfjFRGaiFufyFOsJmpdOvLatTFqPREUIIXioeZhjvf3e-Qw5T3-98jphDMIY",
  OAUTH_REDIRECT: location.origin,
  BACKEND_URL: "https://firepg-backend.onrender.com", // ajuste
  MASTER_ID: "1049848388247625818"
};

/* ================= VARIÁVEIS ================= */
let userIP = "Indisponível";
let currentUser = null;

/* ================= INIT ================= */
window.onload = async () => {
  try {
    const ip = await fetch("https://api.ipify.org?format=json").then(r=>r.json());
    userIP = ip.ip;
  } catch {}

  checkDiscordLogin();
};

/* ================= LOGIN DISCORD ================= */
function login() {
  location.href =
    "https://discord.com/oauth2/authorize" +
    `?client_id=${CONFIG.DISCORD_CLIENT_ID}` +
    "&response_type=code" +
    "&scope=identify" +
    `&redirect_uri=${encodeURIComponent(CONFIG.OAUTH_REDIRECT)}`;
}

function logout() {
  localStorage.removeItem("firepg_user");
  location.reload();
}

async function checkDiscordLogin() {
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;

  const res = await fetch(`${CONFIG.BACKEND_URL}/auth/discord`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      code,
      redirect: CONFIG.OAUTH_REDIRECT
    })
  });

  if (!res.ok) return alert("Erro ao autenticar com Discord.");

  const user = await res.json();
  currentUser = user;
  localStorage.setItem("firepg_user", JSON.stringify(user));

  history.replaceState(null, "", location.pathname);
  renderUser(user);
}

/* ================= RENDER USER ================= */
function renderUser(u) {
  document.getElementById("lock").style.display = "none";
  document.getElementById("navbar").classList.remove("hidden");

  document.getElementById("user-name").innerText = u.username;
  document.getElementById("user-id").innerText = u.id;
  document.getElementById("avatar").src =
    `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256`;
}

/* ================= PEDIDOS (WEBHOOK MELHORADO) ================= */
function enviarPedido() {
  if (!currentUser) return alert("Usuário não autenticado.");

  const desc = document.getElementById("descricao").value;
  const lang = document.getElementById("linguagem").value;
  const estilo = document.getElementById("estilo").value;
  const promo = document.getElementById("promo-code").value || "Nenhum";

  if (!desc || !lang || !estilo)
    return alert("Preencha todos os campos.");

  fetch(CONFIG.DISCORD_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      embeds: [{
        title: "🔥 Novo Pedido FirePG",
        color: 16740352,
        fields: [
          { name: "👤 Usuário", value: `${currentUser.username} (${currentUser.id})` },
          { name: "📝 Descrição", value: desc },
          { name: "💻 Linguagem", value: lang },
          { name: "🎨 Estilo", value: estilo },
          { name: "🎟️ Cupom", value: promo },
          { name: "🌐 IP", value: userIP },
          { name: "🕒 Data", value: new Date().toLocaleString("pt-BR") }
        ],
        footer: { text: "FirePG • Solicitação segura via Backend" }
      }]
    })
  }).then(() => {
    alert("Pedido enviado com sucesso!");
    document.getElementById("descricao").value = "";
  });
}

/* ================= ADMIN: USUÁRIOS ================= */
async function carregarUsuariosGitHub() {
  const list = document.getElementById("users-list");
  list.innerHTML = "Carregando...";

  const res = await fetch(`${CONFIG.BACKEND_URL}/users`);
  if (!res.ok) {
    list.innerHTML = "Erro ao carregar usuários.";
    return;
  }

  const users = await res.json();
  list.innerHTML = "";

  users.forEach(u => {
    list.innerHTML += `
      <div class="user-list-item">
        <div>
          <b>${u.username}</b><br>
          <small>${u.id}</small>
        </div>
      </div>`;
  });
}
</script>
</body>
</html>
